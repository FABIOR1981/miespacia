name = "miespacia"
main = "src/worker.mjs"
compatibility_date = "2026-10-01"

# La página (public/) la sirven los assets; /api/* pasa primero por el Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Email del administrador: debe ser el mismo con el que se inicia sesión en Cloudflare Access.
[vars]
ADMIN_EMAIL = "fabior1981@gmail.com"
