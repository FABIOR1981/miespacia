<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>miEspacia</title>
  <link rel="stylesheet" href="estilos/base.css">
  <link rel="stylesheet" href="estilos/paletas.css">
  <style>
    body { background: var(--bruma); margin: 0; }
    .barra { position: sticky; top: 0; z-index: 20; background: var(--barra-fondo); color: var(--sobre-tinta); height: var(--alto-barra); display: flex; align-items: center; padding: 0 16px; font-weight: 700; color: #fff; }
    .contenido { max-width: 960px; margin: 0 auto; padding: 16px 16px 48px; display: grid; gap: 14px; }

    .cabecera-dia { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
    .fecha-actual { font-size: clamp(1.3rem, 3vw, 1.8rem); font-weight: 700; color: var(--tinta); }
    .fecha-actual small { display: block; font-size: .95rem; font-weight: 500; color: var(--tinta-suave); }
    .nav-fecha { display: flex; gap: 6px; }
    .nav-fecha .boton { background: var(--papel); border: 1.5px solid var(--linea-fuerte); min-height: 40px; }

    .tira-dias { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .tira-dias::-webkit-scrollbar { display: none; }
    .dia { flex: 1 1 0; min-width: 52px; display: grid; justify-items: center; padding: 8px 6px; background: var(--papel); border: 1.5px solid var(--linea); border-radius: 12px; font: inherit; color: var(--tinta); }
    .dia-nombre { font-size: .8rem; color: var(--tinta-suave); }
    .dia-numero { font-size: 1.15rem; font-weight: 650; }
    .dia[aria-pressed="true"] { background: var(--activo-fondo); border-color: var(--activo-fondo); color: #fff; }
    .dia[aria-pressed="true"] .dia-nombre { color: var(--sobre-tinta); }

    .grilla { background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio-tarjeta); overflow: hidden; }
    .fila-hora { display: grid; grid-template-columns: 64px 1fr; border-bottom: 1px solid var(--linea); min-height: 52px; }
    .fila-hora:last-child { border-bottom: 0; }
    .hora { display: grid; place-items: start center; padding-top: 14px; font-size: .85rem; color: var(--tinta-suave); font-variant-numeric: tabular-nums; border-right: 1px solid var(--linea); }
    .celda { padding: 8px 10px; display: flex; align-items: center; gap: 8px; }
    .libre { flex: 1; text-align: left; background: repeating-linear-gradient(135deg, transparent 0 6px, var(--bruma) 6px 7px); border: 1.5px dashed var(--linea-fuerte); border-radius: 10px; min-height: 36px; padding: 0 12px; color: var(--tinta-suave); font: inherit; }
    .libre:hover { border-color: var(--pino); color: var(--pino-oscuro); }
    .reserva { flex: 1; display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--pino-claro); border-left: 4px solid var(--pino); border-radius: 10px; padding: 8px 12px; color: var(--tinta); }
    .reserva.cancelada { background: var(--bruma); border-left-color: var(--linea-fuerte); color: var(--tinta-suave); text-decoration: line-through; }

    .panel { background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio-tarjeta); padding: 16px; display: grid; gap: 10px; }
    .panel h2 { margin: 0; font-size: 1.05rem; color: var(--tinta); }
    .fila { display: flex; flex-wrap: wrap; gap: 8px; }
    .fila input, .fila select { flex: 1 1 160px; min-height: 42px; padding: 0 12px; border: 1.5px solid var(--linea-fuerte); border-radius: var(--radio-campo); background: var(--papel); }
    .aviso { color: var(--error-texto); background: var(--peligro-claro); border-radius: var(--radio-campo); padding: 10px 12px; }
    .aviso:empty { display: none; }
    .lista-clientes { list-style: none; margin: 0; padding: 0; }
    .lista-clientes li { padding: 8px 0; border-bottom: 1px solid var(--linea); }
    .detalle { color: var(--tinta-suave); font-size: .9rem; }
  </style>
</head>
<body>
  <header class="barra">miEspacia</header>

  <main class="contenido">
    <p class="aviso" id="aviso" role="alert"></p>

    <div class="cabecera-dia">
      <div class="fecha-actual" id="fecha-actual"></div>
      <div class="nav-fecha">
        <button class="boton" id="ir-ayer" aria-label="Día anterior">←</button>
        <button class="boton" id="ir-hoy">Hoy</button>
        <button class="boton" id="ir-manana" aria-label="Día siguiente">→</button>
      </div>
    </div>

    <div class="tira-dias" id="tira-dias" role="group" aria-label="Días"></div>

    <section class="grilla" id="grilla" aria-label="Horarios del día"></section>

    <section class="panel" id="panel-reserva" hidden>
      <h2 id="titulo-reserva"></h2>
      <form id="form-reserva" class="fila">
        <select name="clienteId" id="select-cliente" required></select>
        <button class="boton boton-primario">Reservar</button>
        <button type="button" class="boton boton-secundario" id="cerrar-reserva">Cerrar</button>
      </form>
    </section>

    <section class="panel">
      <h2>Clientes</h2>
      <form id="form-cliente" class="fila">
        <input name="nombre" placeholder="Nombre" required>
        <input name="telefono" placeholder="Teléfono">
        <input name="notas" placeholder="Notas">
        <button class="boton boton-primario">Agregar</button>
      </form>
      <ul class="lista-clientes" id="lista-clientes"></ul>
    </section>
  </main>

<script>
  const HORAS = Array.from({ length: 12 }, (_, i) => String(8 + i).padStart(2, '0') + ':00'); // 08:00 a 19:00
  const formato = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Montevideo', year: 'numeric', month: '2-digit', day: '2-digit' });
  const nombreDia = new Intl.DateTimeFormat('es-UY', { timeZone: 'UTC', weekday: 'short' });
  const titulo = new Intl.DateTimeFormat('es-UY', { timeZone: 'UTC', weekday: 'long', day: 'numeric', month: 'long' });

  let diaSeleccionado = fechaDesplazada(0);
  let horaElegida = null;

  const $ = (id) => document.getElementById(id);
  const mostrarError = (msg) => { $('aviso').textContent = msg || ''; };

  function fechaDesplazada(n) { return formato.format(new Date(Date.now() + n * 86400000)); }
  function aDate(fecha) { return new Date(fecha + 'T12:00:00Z'); }
  function sumarDias(fecha, n) { const d = aDate(fecha); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function escapar(texto) {
    return String(texto).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  async function api(metodo, ruta, cuerpo) {
    const r = await fetch(ruta, { method: metodo, headers: { 'Content-Type': 'application/json' }, body: cuerpo ? JSON.stringify(cuerpo) : undefined });
    const datos = await r.json();
    if (!r.ok) throw new Error(datos.error || 'Error');
    return datos;
  }

  function dibujarTira() {
    const dias = Array.from({ length: 7 }, (_, i) => sumarDias(diaSeleccionado, i - 3));
    $('tira-dias').innerHTML = dias.map((f) => `
      <button class="dia" data-dia="${f}" aria-pressed="${f === diaSeleccionado}">
        <span class="dia-nombre">${nombreDia.format(aDate(f)).replace('.', '')}</span>
        <span class="dia-numero">${Number(f.slice(8))}</span>
      </button>`).join('');
    $('fecha-actual').innerHTML = `${titulo.format(aDate(diaSeleccionado))}<small>${diaSeleccionado === fechaDesplazada(0) ? 'Hoy' : ''}</small>`;
  }

  async function dibujarGrilla() {
    const turnos = await api('GET', `/api/turnos?desde=${diaSeleccionado}&hasta=${diaSeleccionado}`);
    const porHora = Object.fromEntries(turnos.filter((t) => !t.cancelado).map((t) => [t.hora, t]));
    const cancelados = turnos.filter((t) => t.cancelado);
    $('grilla').innerHTML = HORAS.map((h) => {
      const t = porHora[h];
      const celda = t
        ? `<div class="reserva"><span><strong>${escapar(t.clienteNombre || '')}</strong></span>
             <button class="boton boton-secundario" data-cancelar="${t.id}">Cancelar</button></div>`
        : `<button class="libre" data-hora="${h}">Libre · reservar</button>`;
      return `<div class="fila-hora"><div class="hora">${h}</div><div class="celda">${celda}</div></div>`;
    }).join('');
    if (cancelados.length) {
      $('grilla').innerHTML += cancelados.map((t) =>
        `<div class="fila-hora"><div class="hora">${t.hora}</div><div class="celda"><div class="reserva cancelada">${escapar(t.clienteNombre || '')} (cancelado)</div></div></div>`).join('');
    }
  }

  async function cargarClientes() {
    const clientes = await api('GET', '/api/clientes');
    $('lista-clientes').innerHTML = clientes.map((c) =>
      `<li>${escapar(c.nombre)} <span class="detalle">${escapar(c.telefono || '')}</span></li>`).join('')
      || '<li class="detalle">Todavía no hay clientes</li>';
    $('select-cliente').innerHTML = clientes.map((c) => `<option value="${c.id}">${escapar(c.nombre)}</option>`).join('');
    return clientes;
  }

  async function refrescar() {
    dibujarTira();
    await dibujarGrilla();
  }

  function abrirReserva(hora) {
    horaElegida = hora;
    $('titulo-reserva').textContent = `Reservar ${hora} · ${titulo.format(aDate(diaSeleccionado))}`;
    $('panel-reserva').hidden = false;
    $('select-cliente').focus();
  }

  $('tira-dias').addEventListener('click', (e) => {
    const b = e.target.closest('[data-dia]');
    if (!b) return;
    diaSeleccionado = b.dataset.dia;
    $('panel-reserva').hidden = true;
    mostrarError();
    refrescar().catch((err) => mostrarError(err.message));
  });

  $('grilla').addEventListener('click', async (e) => {
    const libre = e.target.closest('[data-hora]');
    const cancelar = e.target.closest('[data-cancelar]');
    mostrarError();
    try {
      if (libre) abrirReserva(libre.dataset.hora);
      if (cancelar) { await api('POST', `/api/turnos/${cancelar.dataset.cancelar}/cancelar`); await dibujarGrilla(); }
    } catch (err) { mostrarError(err.message); }
  });

  $('form-reserva').addEventListener('submit', async (e) => {
    e.preventDefault();
    mostrarError();
    try {
      await api('POST', '/api/turnos', { clienteId: Number($('select-cliente').value), fecha: diaSeleccionado, hora: horaElegida });
      $('panel-reserva').hidden = true;
      await dibujarGrilla();
    } catch (err) { mostrarError(err.message); }
  });
  $('cerrar-reserva').addEventListener('click', () => { $('panel-reserva').hidden = true; });

  $('form-cliente').addEventListener('submit', async (e) => {
    e.preventDefault();
    mostrarError();
    try {
      await api('POST', '/api/clientes', Object.fromEntries(new FormData(e.target)));
      e.target.reset();
      await cargarClientes();
    } catch (err) { mostrarError(err.message); }
  });

  $('ir-ayer').addEventListener('click', () => { diaSeleccionado = sumarDias(diaSeleccionado, -1); refrescar().catch((err) => mostrarError(err.message)); });
  $('ir-manana').addEventListener('click', () => { diaSeleccionado = sumarDias(diaSeleccionado, 1); refrescar().catch((err) => mostrarError(err.message)); });
  $('ir-hoy').addEventListener('click', () => { diaSeleccionado = fechaDesplazada(0); refrescar().catch((err) => mostrarError(err.message)); });

  cargarClientes().then(refrescar).catch((err) => mostrarError(err.message));
</script>
</body>
</html>
