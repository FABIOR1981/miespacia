<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>miEspacia</title>
  <link rel="stylesheet" href="estilos/base.css">
  <link rel="stylesheet" href="estilos/paletas.css">
  <style>
    body { background: var(--bruma); margin: 0; }
    .contenedor { max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 18px; }
    .cabecera { display: flex; align-items: center; gap: 10px; }
    .cabecera h1 { font-size: 1.6rem; margin: 0; font-weight: 700; color: var(--tinta); }
    .tarjeta { background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio-tarjeta); padding: 18px; }
    .tarjeta h2 { font-size: 1.1rem; margin: 0 0 12px; color: var(--tinta); }
    .fila { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .fila input, .fila select { flex: 1 1 160px; min-height: 42px; padding: 0 12px; border: 1.5px solid var(--linea-fuerte); border-radius: var(--radio-campo); background: var(--papel); }
    .lista { list-style: none; margin: 0; padding: 0; }
    .lista li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--linea); }
    .lista li:last-child { border-bottom: 0; }
    .detalle { color: var(--tinta-suave); font-size: .92rem; }
    .cancelado { color: var(--tinta-suave); text-decoration: line-through; }
    .vacio { color: var(--tinta-suave); font-style: italic; }
    .aviso { color: var(--error-texto); background: var(--peligro-claro); border-radius: var(--radio-campo); padding: 10px 12px; min-height: 0; }
    .aviso:empty { display: none; }
  </style>
</head>
<body>
  <main class="contenedor">
    <header class="cabecera">
      <h1>miEspacia</h1>
    </header>

    <p class="aviso" id="aviso" role="alert"></p>

    <section class="tarjeta">
      <h2>Clientes</h2>
      <form id="form-cliente" class="fila">
        <input name="nombre" placeholder="Nombre" required>
        <input name="telefono" placeholder="Teléfono">
        <input name="notas" placeholder="Notas">
        <button class="boton boton-primario">Agregar</button>
      </form>
      <ul class="lista" id="lista-clientes"></ul>
    </section>

    <section class="tarjeta">
      <h2>Agendar turno</h2>
      <form id="form-turno" class="fila">
        <select name="clienteId" id="select-cliente" required></select>
        <input type="date" name="fecha" required>
        <input type="time" name="hora" required>
        <button class="boton boton-primario">Agendar</button>
      </form>
    </section>

    <section class="tarjeta">
      <h2>Próximos turnos (30 días)</h2>
      <ul class="lista" id="lista-turnos"></ul>
    </section>
  </main>

<script>
  const $ = (id) => document.getElementById(id);
  const mostrarError = (msg) => { $('aviso').textContent = msg || ''; };

  async function api(metodo, ruta, cuerpo) {
    const r = await fetch(ruta, {
      method: metodo,
      headers: { 'Content-Type': 'application/json' },
      body: cuerpo ? JSON.stringify(cuerpo) : undefined,
    });
    const datos = await r.json();
    if (!r.ok) throw new Error(datos.error || 'Error');
    return datos;
  }

  // Fechas en hora de Montevideo, no UTC, para que de noche no salte al día siguiente.
  const formato = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Montevideo', year: 'numeric', month: '2-digit', day: '2-digit' });
  function fechaLocal(n = 0) { return formato.format(new Date(Date.now() + n * 86400000)); }

  function escapar(texto) {
    return String(texto).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  async function cargarClientes() {
    const clientes = await api('GET', '/api/clientes');
    $('lista-clientes').innerHTML = clientes.map((c) =>
      `<li><span>${escapar(c.nombre)} <span class="detalle">${escapar(c.telefono || '')}</span></span></li>`).join('')
      || '<li class="vacio">Todavía no hay clientes</li>';
    $('select-cliente').innerHTML = clientes.map((c) => `<option value="${c.id}">${escapar(c.nombre)}</option>`).join('');
  }

  async function cargarTurnos() {
    const turnos = await api('GET', `/api/turnos?desde=${fechaLocal()}&hasta=${fechaLocal(30)}`);
    $('lista-turnos').innerHTML = turnos.map((t) => `
      <li>
        <span class="${t.cancelado ? 'cancelado' : ''}">${t.fecha} · ${t.hora} · ${escapar(t.clienteNombre || '')}</span>
        ${t.cancelado ? '<span class="detalle">cancelado</span>' : `<button class="boton boton-secundario" data-cancelar="${t.id}">Cancelar</button>`}
      </li>`).join('') || '<li class="vacio">No hay turnos en los próximos 30 días</li>';
  }

  $('form-cliente').addEventListener('submit', async (e) => {
    e.preventDefault();
    mostrarError();
    try {
      await api('POST', '/api/clientes', Object.fromEntries(new FormData(e.target)));
      e.target.reset();
      await cargarClientes();
    } catch (err) { mostrarError(err.message); }
  });

  $('form-turno').addEventListener('submit', async (e) => {
    e.preventDefault();
    mostrarError();
    const datos = Object.fromEntries(new FormData(e.target));
    datos.clienteId = Number(datos.clienteId);
    try {
      await api('POST', '/api/turnos', datos);
      await cargarTurnos();
    } catch (err) { mostrarError(err.message); }
  });

  $('lista-turnos').addEventListener('click', async (e) => {
    const id = e.target.dataset.cancelar;
    if (!id) return;
    mostrarError();
    try {
      await api('POST', `/api/turnos/${id}/cancelar`);
      await cargarTurnos();
    } catch (err) { mostrarError(err.message); }
  });

  cargarClientes().then(cargarTurnos).catch((err) => mostrarError(err.message));
</script>
</body>
</html>
